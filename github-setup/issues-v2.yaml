stretch:
  - key: F10
    title: "Stretch: Crunch warning, the latest start day that still clears the target"
    previous_titles: ["Crunch detection and explicit tradeoffs"]
    labels: ["type:stretch", "area:planner", "priority:p2"]
    remove_labels: ["claude-ready"]
    story: "As a student, I want to know the latest day I can start studying and still clear my target so that I can plan ahead of an exam cluster."
    design_section: "Decision"
    notes: |
      A stretch goal in design-v2 (Decision). For each possible start day d, compute P(target | start studying on d)
      and flag the latest d that still clears the target, for example "start MATH 100 by Nov 12 to stay above 80%".
      Needs the exhaustive plan search. Copy says "students like you", never "you will".
      The unreachable and already-locked-in cases are covered by the achievable-grade bounds task, not here.

  - key: F11
    title: "Stretch: Start-date chart in the popup"
    previous_titles: ["Start-date curve: P(score >= target) by start date in the popup"]
    labels: ["type:stretch", "area:extension", "area:planner", "priority:p2"]
    remove_labels: ["claude-ready"]
    story: "As a student, I want to see my chance of my target by the day I start studying so that I can see what waiting costs."
    design_section: "Decision"
