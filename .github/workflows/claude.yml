# Coding agent, on demand:
#   1. Mention @claude in an issue or PR comment/review -> Claude responds or pushes fixes.
#   2. Add the `claude-now` label to an issue -> Claude implements it right away as a draft PR.
#      (`claude-ready` only marks issues the nightly run may pick; it never triggers a run, so
#      creating issues in bulk with labels can't start dozens of runs at once.)
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) and GH_PAT
# (fine-grained token for this repo: Contents, Pull requests, Issues = read/write).
# GH_PAT matters: pushes and PRs made with the default GITHUB_TOKEN do NOT trigger
# other workflows, so CI and the reviewer would never run on Claude's PRs.
#
# Plugins: Ponytail (minimal code), security-guidance, and TypeScript/Python
# code intelligence. Pin Ponytail to a commit you've reviewed by appending
# #<commit-sha> to its marketplace URL: plugins run with access to this job's secrets.
# Check https://github.com/anthropics/claude-code-action for current input names.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  mention:
    # Only you (OWNER/MEMBER/COLLABORATOR) can summon the agent.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Language servers for the LSP plugins
        run: npm install -g typescript typescript-language-server pyright
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/DietrichGebert/ponytail.git
          plugins: |
            ponytail@ponytail
            security-guidance@claude-plugins-official
            typescript-lsp@claude-plugins-official
            pyright-lsp@claude-plugins-official

  implement-labeled-issue:
    if: github.event_name == 'issues' && github.event.label.name == 'claude-now'
    runs-on: ubuntu-latest
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Language servers for the LSP plugins
        run: npm install -g typescript typescript-language-server pyright
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/DietrichGebert/ponytail.git
          plugins: |
            ponytail@ponytail
            security-guidance@claude-plugins-official
            typescript-lsp@claude-plugins-official
            pyright-lsp@claude-plugins-official
          claude_args: >-
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(pytest:*),Bash(python:*),Bash(pip:*),Bash(ruff:*),Bash(git:*),Bash(gh:*),Edit,Write,Read,Glob,Grep,Task"
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            1. Read CLAUDE.md, docs/design.md and docs/tradeoffs.md, then the issue and its
               parent story (`gh issue view ${{ github.event.issue.number }} --comments`).
            2. If the issue is labeled needs-human or blocked, or the acceptance criteria
               are ambiguous, comment on the issue with specific questions, add the
               needs-human label, and stop. Do not guess.
            3. Create branch claude/issue-${{ github.event.issue.number }}. Implement the
               smallest change that meets every criterion (Ponytail mode), with a test for
               each criterion. CLAUDE.md and the acceptance criteria override minimalism.
            4. Run the relevant suites (npm test in extension/, pytest) until they pass.
            5. Open a DRAFT pull request. The body starts with
               "Closes #${{ github.event.issue.number }}", then lists each acceptance
               criterion with how it was verified, then open questions.
               A separate reviewer agent will check it against the criteria.
            6. Comment on the issue with a two-line summary and the PR link, and remove
               the claude-now label (`gh issue edit <n> --remove-label claude-now`).

            Never push to main, never merge, never edit .github/workflows/.
