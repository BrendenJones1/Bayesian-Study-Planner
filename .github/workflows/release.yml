# CD for the extension: push a tag like v0.1.0 and this builds the extension
# and attaches a zip to a GitHub release (load it with "Load unpacked" or
# upload it to the Chrome Web Store later).

name: Release extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: extension
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test --if-present
          npm run build

      - name: Package and publish
        run: |
          name="bayesian-study-planner-${GITHUB_REF_NAME}.zip"
          (cd extension/dist && zip -r "../../$name" .)
          gh release create "$GITHUB_REF_NAME" "$name" --generate-notes --title "$GITHUB_REF_NAME"
